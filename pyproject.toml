[project]
name = "lean"
version = "0.2.0"
description = "Token-efficient toolkit for Claude Code agents"
authors = [{ name = "AuXFire" }]
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
target-version = "py38"
line-length = 160
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E731", "B904", "E741"]
